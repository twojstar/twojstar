plugins {
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
}

repositories {
    mavenCentral()
}

// JavaFX is pulled in as plain classpath dependencies (no openjfx plugin): the fat jar
// below flattens everything into one artifact, and Main.kt deliberately is not the
// Application subclass, which is what keeps a non-modular launch working.
def javafxVersion = '21.0.12'
def javafxModules = ['base', 'graphics', 'controls', 'fxml']
def javafxPlatforms = ['win', 'linux', 'linux-aarch64', 'mac', 'mac-aarch64']

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-javafx:1.11.0"
    javafxModules.each { m ->
        javafxPlatforms.each { p ->
            implementation "org.openjfx:javafx-$m:$javafxVersion:$p"
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

application {
    mainClass = 'Main'
}

tasks.named('jar', Jar) {
    manifest {
        attributes 'Main-Class': 'Main',
                   // JavaFX loads its native libraries; without this JDK 24+ prints a restricted-method warning.
                   'Enable-Native-Access': 'ALL-UNNAMED'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Signature files from dependency jars invalidate the merged archive.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/**/module-info.class', 'module-info.class'
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
