name: IntentKeyboard

options:
  bundleIdPrefix: io.github.twojstar.intentkeyboard
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  IntentKeyboardHost:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.twojstar.intentkeyboard
    info:
      path: Host/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: IntentKeyboardExtension

  IntentKeyboardExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: KeyboardExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.twojstar.intentkeyboard.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: KeyboardExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrimaryLanguage: pl-PL
            RequestsOpenAccess: false
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    dependencies:
      - framework: ../../core/build/XCFrameworks/debug/IntentKeyboardCore.xcframework
        embed: false

  IntentKeyboardPreferencesTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: KeyboardExtension/KeyboardRenderPreferences.swift
      - path: KeyboardExtension/KeyboardRenderState.swift
      - path: KeyboardExtensionTests

schemes:
  IntentKeyboard:
    build:
      targets:
        IntentKeyboardHost: all
        IntentKeyboardExtension: all
    run:
      config: Debug

  IntentKeyboardPreferencesTests:
    build:
      targets:
        IntentKeyboardPreferencesTests: all
    test:
      config: Debug
      targets:
        - IntentKeyboardPreferencesTests
