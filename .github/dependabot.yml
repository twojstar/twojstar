version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: "npm"
    directory: "/benches"
    schedule: { interval: "weekly" }
    groups:
      benches: { patterns: ["*"] }

  - package-ecosystem: "npm"
    directory: "/weather-feed"
    schedule: { interval: "weekly" }
    groups:
      weather: { patterns: ["*"] }

  - package-ecosystem: "gradle"
    directory: "/xiaomi-adb-tools"
    schedule: { interval: "weekly" }
    groups:
      xiaomi: { patterns: ["*"] }

  - package-ecosystem: "nuget"
    directories:
      - "/feedboard/src/Feedboard.Core"
      - "/feedboard/src/Feedboard.Settings"
      - "/feedboard/src/Feedboard.WidgetProvider"
    schedule: { interval: "weekly" }
    groups:
      dotnet: { patterns: ["*"] }
