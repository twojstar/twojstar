version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "21:37"
      timezone: "Europe/Warsaw"
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: "npm"
    directory: "/benches"
    schedule:
      interval: "weekly"
      time: "21:37"
      timezone: "Europe/Warsaw"
    groups:
      benches: { patterns: ["*"] }

  - package-ecosystem: "npm"
    directory: "/weather-feed"
    schedule:
      interval: "weekly"
      time: "21:37"
      timezone: "Europe/Warsaw"
    groups:
      weather: { patterns: ["*"] }

  - package-ecosystem: "gradle"
    directory: "/xiaomi-adb-tools"
    schedule:
      interval: "weekly"
      time: "21:37"
      timezone: "Europe/Warsaw"
    groups:
      xiaomi: { patterns: ["*"] }

  - package-ecosystem: "nuget"
    directories:
      - "/feedboard/src/Feedboard.Core"
      - "/feedboard/src/Feedboard.Settings"
      - "/feedboard/src/Feedboard.WidgetProvider"
      - "/paintdotnet/**"
    schedule:
      interval: "weekly"
      time: "21:37"
      timezone: "Europe/Warsaw"
    groups:
      dotnet: { patterns: ["*"] }
