name: Intent keyboard CI

on:
  push:
    branches: [main]
    paths:
      - "intent-keyboard/**"
      - ".github/workflows/intent-keyboard-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "intent-keyboard/**"
      - ".github/workflows/intent-keyboard-ci.yml"
  workflow_dispatch:

concurrency:
  group: intent-keyboard-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: intent-keyboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.6.0"

      - run: gradle :core:desktopTest :platforms:android:assembleDebug --stacktrace

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: intent-keyboard-android-debug
          path: intent-keyboard/platforms/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
