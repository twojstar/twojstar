name: Intent keyboard CI

on:
  push:
    branches: [main]
    paths:
      - "intent-keyboard/**"
      - ".github/workflows/intent-keyboard-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "intent-keyboard/**"
      - ".github/workflows/intent-keyboard-ci.yml"
  workflow_dispatch:

concurrency:
  group: intent-keyboard-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: intent-keyboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.6.0"

      - run: >-
          gradle
          :core:desktopTest
          :core:testAndroidHostTest
          :platforms:android:testDebugUnitTest
          :platforms:android:assembleDebug
          :platforms:desktop:test
          :platforms:desktop:distZip
          --stacktrace

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: intent-keyboard-android-debug
          path: intent-keyboard/platforms/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: intent-keyboard-desktop
          path: intent-keyboard/platforms/desktop/build/distributions/*.zip
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: intent-keyboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.6.0"

      - name: Test and assemble shared iOS core
        run: >-
          gradle
          :core:iosSimulatorArm64Test
          :core:assembleIntentKeyboardCoreDebugXCFramework
          --stacktrace

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec platforms/ios/project.yml --project platforms/ios

      - name: Test keyboard preferences
        run: >-
          xcodebuild
          -project platforms/ios/IntentKeyboard.xcodeproj
          -scheme IntentKeyboardPreferencesTests
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Build host and keyboard extension
        run: >-
          xcodebuild
          -project platforms/ios/IntentKeyboard.xcodeproj
          -scheme IntentKeyboard
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build
