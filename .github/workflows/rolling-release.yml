---
name: Unified rolling release

on: # yamllint disable-line rule:truthy
  workflow_run:
    workflows:
      - Benches portable release
      - Feedboard CI
      - Xiaomi ADB Tools CI
      - Paint.NET ICO CI
      - Paint.NET AI CI
      - Audacity VST3 CI
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: unified-rolling-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish compact snapshot
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write

    steps:
      - name: Assemble product bundles
        id: assemble
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf assets work
          mkdir -p assets work
          provenance="work/ROLLING-PROVENANCE.tsv"
          previous_provenance="work/PREVIOUS-PROVENANCE.tsv"
          : > "$provenance"
          : > "$previous_provenance"
          updated=0

          latest_run() {
            local workflow="$1" result cache_key cache_file miss_file
            cache_key="${workflow//[^A-Za-z0-9_.-]/_}"
            cache_file="work/latest-run-$cache_key.tsv"
            miss_file="work/latest-run-$cache_key.missing"

            if [ -s "$cache_file" ]; then
              cat "$cache_file"
              return 0
            fi
            if [ -f "$miss_file" ]; then
              return 1
            fi

            if ! result="$(gh api --method GET "repos/$GH_REPO/actions/workflows/$workflow/runs" \
              -f branch=main -f status=success -F per_page=1 \
              --jq '.workflow_runs[0] | "\(.id)\t\(.run_attempt)\t\(.head_sha)"')"; then
              echo "Failed to resolve the latest successful run for $workflow." >&2
              return 2
            fi
            if [ -z "$result" ] || [ "$result" = $'null\tnull\tnull' ]; then
              : > "$miss_file"
              return 1
            fi
            printf '%s\n' "$result" > "$cache_file"
            printf '%s\n' "$result"
          }

          artifact_available() {
            local run_id="$1" artifact="$2" names
            if ! names="$(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | .name')"; then
              echo "Artifact lookup failed for run $run_id." >&2
              return 2
            fi
            grep -Fxq "$artifact" <<< "$names"
          }

          run_still_matches() {
            local run_id="$1" expected_attempt="$2" expected_sha="$3"
            local state actual_attempt status conclusion actual_sha
            if ! state="$(gh api "repos/$GH_REPO/actions/runs/$run_id" \
              --jq '"\(.run_attempt)\t\(.status)\t\(.conclusion)\t\(.head_sha)"')"; then
              echo "Failed to re-check source run $run_id after downloading its artifact." >&2
              return 2
            fi
            IFS=$'\t' read -r actual_attempt status conclusion actual_sha <<< "$state"
            [ "$actual_attempt" = "$expected_attempt" ] && \
              [ "$status" = completed ] && \
              [ "$conclusion" = success ] && \
              [ "$actual_sha" = "$expected_sha" ]
          }

          record_source() {
            printf '%s\t%s\t%s\t%s\t%s\n' "$1" "$2" "$3" "$4" "$5" >> "$provenance"
          }

          current_run() {
            local product="$1"
            awk -F '\t' -v product="$product" \
              '$1 == product { print $3; found=1 } END { if (!found) print 0 }' "$previous_provenance"
          }

          current_attempt() {
            local product="$1"
            if [ "$previous_format" != compact-v2 ]; then
              printf '0\n'
              return
            fi
            awk -F '\t' -v product="$product" \
              '$1 == product { print $4; found=1 } END { if (!found) print 0 }' "$previous_provenance"
          }

          copy_previous_source() {
            local product="$1" line
            [ "$previous_format" = compact-v2 ] || return 1
            line="$(awk -F '\t' -v product="$product" '$1 == product { print; exit }' "$previous_provenance")"
            [ -n "$line" ] || return 1
            printf '%s\n' "$line" >> "$provenance"
          }

          previous_tag="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
          previous_format=""
          if [[ "$previous_tag" =~ ^rolling-[0-9]+-[0-9]+$ ]]; then
            gh release view "$previous_tag" --repo "$GH_REPO" --json body --jq .body > work/previous-body.md
            if grep -Fxq '<!-- rolling-format: compact-v2 -->' work/previous-body.md; then
              previous_format="compact-v2"
            elif grep -Fxq '<!-- rolling-format: compact-v1 -->' work/previous-body.md; then
              previous_format="compact-v1"
            fi
            if [ -n "$previous_format" ]; then
              awk \
                '/<!-- rolling-provenance-begin -->/ { capture=1; next } \
                 /<!-- rolling-provenance-end -->/ { capture=0 } \
                 capture' work/previous-body.md > "$previous_provenance"
            fi
            for bundle in \
              benches-portable.zip \
              feedboard.zip \
              xiaomi-adb-tools.zip \
              paintdotnet-ico.zip \
              paintdotnet-ai.zip \
              audacity-auto-declip-windows.zip \
              audacity-auto-declip-linux.zip; do
              gh release download "$previous_tag" --repo "$GH_REPO" --pattern "$bundle" --dir assets >/dev/null 2>&1 || true
            done
          else
            previous_tag=""
          fi

          preserve_or_fail() {
            local product="$1" package="$2"
            if [ -s "assets/$package" ] && copy_previous_source "$product"; then
              echo "$product: preserving $package with its exact previous provenance."
              return 0
            fi
            echo "Cannot safely preserve $product: bundle or compact-v2 provenance is missing." >&2
            exit 1
          }

          resolve_product() {
            local product="$1" workflow="$2" artifact="$3" package="$4" downloader="$5"
            local info run_id attempt sha status published_run published_attempt
            published_run="$(current_run "$product")"
            published_attempt="$(current_attempt "$product")"

            if info="$(latest_run "$workflow")"; then
              IFS=$'\t' read -r run_id attempt sha <<< "$info"
            else
              status=$?
              if [ "$status" -eq 2 ]; then
                exit 1
              fi
              preserve_or_fail "$product" "$package"
              return
            fi

            if [ "$previous_format" = compact-v2 ] && [ -s "assets/$package" ]; then
              if [ "$published_run" -gt "$run_id" ] || \
                 { [ "$published_run" -eq "$run_id" ] && [ "$published_attempt" -ge "$attempt" ]; }; then
                copy_previous_source "$product" || {
                  echo "Missing persisted provenance for preserved $product." >&2
                  exit 1
                }
                echo "$product keeps published run $published_run attempt $published_attempt; latest successful candidate is $run_id attempt $attempt."
                return
              fi
            fi

            if artifact_available "$run_id" "$artifact"; then
              "$downloader" "$run_id"
              if ! run_still_matches "$run_id" "$attempt" "$sha"; then
                echo "$product source run changed while its artifact was being assembled; aborting this snapshot." >&2
                exit 1
              fi
              record_source "$product" "$workflow" "$run_id" "$attempt" "$sha"
              updated=1
              return
            else
              status=$?
            fi

            if [ "$status" -eq 2 ]; then
              exit 1
            fi
            preserve_or_fail "$product" "$package"
          }

          bundle_benches() {
            local run_id="$1"
            rm -rf work/benches
            mkdir -p work/benches
            gh run download "$run_id" --repo "$GH_REPO" --name benches-portable-release --dir work/benches
            test -s work/benches/benches-portable.zip
            cp work/benches/benches-portable.zip assets/benches-portable.zip
          }

          bundle_feedboard() {
            local run_id="$1"
            rm -rf work/feedboard
            mkdir -p work/feedboard
            gh run download "$run_id" --repo "$GH_REPO" --name feedboard-msix-x64 --dir work/feedboard
            for file in Feedboard.msix Feedboard.cer install-feedboard.ps1 Install-Feedboard.cmd; do
              test -s "work/feedboard/$file"
            done
            for arch in x86 x64; do
              dependency_dir="work/feedboard/Dependencies/$arch"
              test -d "$dependency_dir"
              if ! find "$dependency_dir" -maxdepth 1 -type f \
                \( -name '*.appx' -o -name '*.msix' \) -print -quit | grep -q .; then
                echo "Feedboard artifact is missing $arch dependency packages." >&2
                exit 1
              fi
            done
            rm -f assets/feedboard.zip
            (
              cd work/feedboard
              zip -9 -r ../../assets/feedboard.zip \
                Feedboard.msix Feedboard.cer install-feedboard.ps1 Install-Feedboard.cmd Dependencies
            )
          }

          bundle_xiaomi() {
            local run_id="$1" copied=0
            rm -rf work/xiaomi
            mkdir -p work/xiaomi
            gh run download "$run_id" --repo "$GH_REPO" --name XiaomiADBFastbootTools --dir work/xiaomi
            test -s work/xiaomi/XiaomiADBFastbootTools-ASSETS.txt
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$file" in
                XiaomiADBFastbootTools-*.jar) ;;
                *) echo "Unexpected Xiaomi artifact in manifest: $file" >&2; exit 1 ;;
              esac
              test -s "work/xiaomi/$file"
              copied=$((copied + 1))
            done < work/xiaomi/XiaomiADBFastbootTools-ASSETS.txt
            [ "$copied" -eq 5 ]
            rm -f assets/xiaomi-adb-tools.zip
            (
              cd work/xiaomi
              zip -9 -j ../../assets/xiaomi-adb-tools.zip \
                XiaomiADBFastbootTools-ASSETS.txt XiaomiADBFastbootTools-*.jar
            )
          }

          bundle_paintdotnet() {
            local run_id="$1"
            rm -rf work/paintdotnet-ico
            mkdir -p work/paintdotnet-ico
            gh run download "$run_id" --repo "$GH_REPO" --name paintdotnet-ico-release --dir work/paintdotnet-ico
            test -s work/paintdotnet-ico/paintdotnet-ico.zip
            cp work/paintdotnet-ico/paintdotnet-ico.zip assets/paintdotnet-ico.zip
          }

          bundle_paintdotnet_ai() {
            local run_id="$1"
            rm -rf work/paintdotnet-ai
            mkdir -p work/paintdotnet-ai
            gh run download "$run_id" --repo "$GH_REPO" --name paintdotnet-ai-release --dir work/paintdotnet-ai
            test -s work/paintdotnet-ai/paintdotnet-ai.zip
            cp work/paintdotnet-ai/paintdotnet-ai.zip assets/paintdotnet-ai.zip
          }

          validate_audacity_package() {
            local archive="$1" entries
            unzip -tq "$archive" >/dev/null
            entries="$(unzip -Z1 "$archive")"
            grep -Eq '(^|/)INSTALL\.txt$' <<< "$entries"
            grep -Eq '(^|/)TravnyAutoDeclip\.vst3/.+' <<< "$entries"
          }

          bundle_audacity_windows() {
            local run_id="$1"
            rm -rf work/audacity-windows
            mkdir -p work/audacity-windows
            gh run download "$run_id" --repo "$GH_REPO" --name audacity-auto-declip-Windows --dir work/audacity-windows
            test -s work/audacity-windows/audacity-auto-declip-windows.zip
            validate_audacity_package work/audacity-windows/audacity-auto-declip-windows.zip
            cp work/audacity-windows/audacity-auto-declip-windows.zip assets/audacity-auto-declip-windows.zip
          }

          bundle_audacity_linux() {
            local run_id="$1"
            rm -rf work/audacity-linux
            mkdir -p work/audacity-linux
            gh run download "$run_id" --repo "$GH_REPO" --name audacity-auto-declip-Linux --dir work/audacity-linux
            test -s work/audacity-linux/audacity-auto-declip-linux.zip
            validate_audacity_package work/audacity-linux/audacity-auto-declip-linux.zip
            cp work/audacity-linux/audacity-auto-declip-linux.zip assets/audacity-auto-declip-linux.zip
          }

          resolve_product Benches benches-release.yml benches-portable-release benches-portable.zip bundle_benches
          resolve_product Feedboard feedboard-ci.yml feedboard-msix-x64 feedboard.zip bundle_feedboard
          resolve_product Xiaomi-ADB-Tools xiaomi-adb-tools-ci.yml XiaomiADBFastbootTools xiaomi-adb-tools.zip bundle_xiaomi
          resolve_product Paint.NET-ICO paintdotnet-ico-ci.yml paintdotnet-ico-release paintdotnet-ico.zip bundle_paintdotnet
          resolve_product Paint.NET-AI paintdotnet-ai-ci.yml paintdotnet-ai-release paintdotnet-ai.zip bundle_paintdotnet_ai
          resolve_product Audacity-Auto-Declip-Windows audacity-vst3-ci.yml audacity-auto-declip-Windows audacity-auto-declip-windows.zip bundle_audacity_windows
          resolve_product Audacity-Auto-Declip-Linux audacity-vst3-ci.yml audacity-auto-declip-Linux audacity-auto-declip-linux.zip bundle_audacity_linux

          if [ "$updated" -eq 0 ] && [ "$previous_format" = compact-v2 ]; then
            echo "No product source run, attempt or public bundle format changed."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for file in \
            benches-portable.zip \
            feedboard.zip \
            xiaomi-adb-tools.zip \
            paintdotnet-ico.zip \
            paintdotnet-ai.zip \
            audacity-auto-declip-windows.zip \
            audacity-auto-declip-linux.zip; do
            test -s "assets/$file"
          done

          (
            cd assets
            sha256sum \
              benches-portable.zip \
              feedboard.zip \
              xiaomi-adb-tools.zip \
              paintdotnet-ico.zip \
              paintdotnet-ai.zip \
              audacity-auto-declip-windows.zip \
              audacity-auto-declip-linux.zip \
              > SHA256SUMS
          )
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish atomic Latest release
        if: steps.assemble.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="rolling-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          published=0

          {
            echo "Rolling snapshot of the latest successful product builds in twojstar/twojstar."
            echo
            echo "### Downloads"
            echo "- \`benches-portable.zip\` - Codebench, Docbench and Streambench portable builds"
            echo "- \`feedboard.zip\` - Feedboard sideload package, certificate, verified installer and dependencies"
            echo "- \`xiaomi-adb-tools.zip\` - all five Xiaomi ADB Tools platform JARs"
            echo "- \`paintdotnet-ico.zip\` - Paint.NET ICO plugin package"
            echo "- \`paintdotnet-ai.zip\` - Paint.NET AI Restore plugin package"
            echo "- \`audacity-auto-declip-windows.zip\` - Travny Auto Declip VST3 for Windows x64"
            echo "- \`audacity-auto-declip-linux.zip\` - Travny Auto Declip VST3 for Linux x64"
            echo "- \`SHA256SUMS\` - checksums for the seven product bundles"
            echo
            echo "### Feedboard"
            echo "Extract \`feedboard.zip\` and double-click \`Install-Feedboard.cmd\`."
            echo
            echo "### Source provenance"
            while IFS=$'\t' read -r product workflow run_id attempt sha; do
              printf -- '- **%s** - %s run #%s attempt %s, commit `%s`\n' \
                "$product" "$workflow" "$run_id" "$attempt" "$sha"
            done < work/ROLLING-PROVENANCE.tsv
            echo
            echo '<!-- rolling-format: compact-v2 -->'
            echo '<!-- rolling-provenance-begin -->'
            cat work/ROLLING-PROVENANCE.tsv
            echo '<!-- rolling-provenance-end -->'
          } > release-notes.md

          cleanup_draft() {
            if [ "$published" -eq 0 ]; then
              gh release delete "$tag" --repo "$GH_REPO" --cleanup-tag --yes >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_draft ERR INT TERM

          gh release create "$tag" --repo "$GH_REPO" --draft \
            --target main --title "twojstar · rolling" --notes-file release-notes.md
          gh release upload "$tag" --repo "$GH_REPO" \
            assets/benches-portable.zip assets/feedboard.zip assets/xiaomi-adb-tools.zip \
            assets/paintdotnet-ico.zip assets/paintdotnet-ai.zip \
            assets/audacity-auto-declip-windows.zip assets/audacity-auto-declip-linux.zip \
            assets/SHA256SUMS
          gh release edit "$tag" --repo "$GH_REPO" --draft=false --latest
          published=1
          trap - ERR INT TERM

          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select((.tag_name | test("^rolling-[0-9]+-[0-9]+$|^benches-[0-9a-f]{12}$")) and .tag_name != "'"$tag"'") | [.id, .tag_name] | @tsv' |
            while IFS=$'\t' read -r release_id old_tag; do
              [ -n "$release_id" ] || continue
              echo "Removing superseded release $old_tag."
              gh api --method DELETE "repos/$GH_REPO/releases/$release_id"
              gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$old_tag" || true
            done

          for legacy in benches-portable-latest feedboard-latest; do
            if gh release view "$legacy" --repo "$GH_REPO" >/dev/null 2>&1; then
              echo "Removing legacy rolling release $legacy."
              gh release delete "$legacy" --repo "$GH_REPO" --cleanup-tag --yes
            fi
          done
