name: Xiaomi ADB Tools CI

on:
  push:
    branches: [main]
    paths:
      - "xiaomi-adb-tools/**"
      - "!xiaomi-adb-tools/**/*.md"
      - ".github/workflows/xiaomi-adb-tools-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "xiaomi-adb-tools/**"
      - "!xiaomi-adb-tools/**/*.md"
      - ".github/workflows/xiaomi-adb-tools-ci.yml"
  workflow_dispatch:

concurrency:
  group: xiaomi-adb-tools-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: xiaomi-adb-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - run: ./gradlew platformJars

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: XiaomiADBFastbootTools
          path: |
            xiaomi-adb-tools/build/libs/XiaomiADBFastbootTools-*.jar
            xiaomi-adb-tools/build/libs/XiaomiADBFastbootTools-ASSETS.txt
          if-no-files-found: error
          retention-days: 7
