name: Weather feed CI

on:
  push:
    branches: [main]
    paths:
      - "weather-feed/**"
      - "!weather-feed/**/*.md"
      - ".github/workflows/weather-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "weather-feed/**"
      - "!weather-feed/**/*.md"
      - ".github/workflows/weather-ci.yml"
  workflow_dispatch:

concurrency:
  group: weather-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    defaults:
      run:
        working-directory: weather-feed
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: weather-feed/package-lock.json

      - run: npm ci
      - run: npm run check
