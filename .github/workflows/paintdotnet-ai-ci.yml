---
name: Paint.NET AI CI

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - paintdotnet/ai/**
      - .gitattributes
      - .github/workflows/paintdotnet-ai-ci.yml
  pull_request:
    branches: [main]
    paths:
      - paintdotnet/ai/**
      - .gitattributes
      - .github/workflows/paintdotnet-ai-ci.yml
  workflow_dispatch:

concurrency:
  group: paintdotnet-ai-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  PLUGIN_DIR: paintdotnet/ai
  PDN_51_URL: https://github.com/paintdotnet/release/releases/download/v5.1.12/paint.net.5.1.12.portable.x64.zip
  PDN_51_SHA256: d5ae7043f2fb9d365b48dfe243a2aca1c74924de99b04b6445916c95354aefa3
  PDN_52_URL: https://github.com/paintdotnet/release/releases/download/v5.2-alpha.5.200.9719.1528/paint.net.5.200.9719.1528.portable.x64.zip
  PDN_52_SHA256: 8a7be1aa650bf09341c2905dcfcc88b662bcf2fb24aff34d8ffc771afc4c88d0
  MODEL_URL: https://huggingface.co/CoderViking/realesr-general-x4v3-onnx/resolve/main/realesr-general-x4v3.onnx?download=true
  MODEL_SHA256: 1940a93ee08283a0a7286183186357b1688fe9fa8ede74604b424586aaddf112

jobs:
  build:
    name: Build, smoke-test and package
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Windows installer line endings
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE "$env:PLUGIN_DIR/Install.bat"
          $text = [IO.File]::ReadAllText($installer)
          if ($text -match "(?<!`r)`n") {
            throw 'Install.bat must be checked out with CRLF line endings.'
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Verify adapter versions
        shell: pwsh
        run: |
          $legacy = [xml](Get-Content "$env:PLUGIN_DIR/PaintDotNetAi.csproj")
          $modern = [xml](Get-Content "$env:PLUGIN_DIR/PaintDotNetAi.Modern.csproj")
          $legacyVersion = $legacy.Project.PropertyGroup.Version | Select-Object -First 1
          $modernVersion = $modern.Project.PropertyGroup.Version | Select-Object -First 1
          if (-not $legacyVersion -or $legacyVersion -ne $modernVersion) {
            throw "Adapter versions differ: legacy=$legacyVersion modern=$modernVersion"
          }

      - name: Download verified Paint.NET SDK binaries
        shell: pwsh
        run: |
          $legacyZip = Join-Path $env:RUNNER_TEMP 'paintdotnet-5.1.zip'
          $modernZip = Join-Path $env:RUNNER_TEMP 'paintdotnet-5.2.zip'
          Invoke-WebRequest $env:PDN_51_URL -OutFile $legacyZip
          Invoke-WebRequest $env:PDN_52_URL -OutFile $modernZip
          $legacyHash = (Get-FileHash $legacyZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $modernHash = (Get-FileHash $modernZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($legacyHash -ne $env:PDN_51_SHA256) { throw 'Paint.NET 5.1 archive checksum mismatch.' }
          if ($modernHash -ne $env:PDN_52_SHA256) { throw 'Paint.NET 5.2 archive checksum mismatch.' }
          Expand-Archive $legacyZip -DestinationPath "$env:RUNNER_TEMP/pdn51"
          Expand-Archive $modernZip -DestinationPath "$env:RUNNER_TEMP/pdn52"
          $legacyProbe = Get-ChildItem "$env:RUNNER_TEMP/pdn51" -Recurse -Filter PaintDotNet.Data.dll | Select-Object -First 1
          $modernProbe = Get-ChildItem "$env:RUNNER_TEMP/pdn52" -Recurse -Filter PaintDotNet.Effects.Core.dll | Select-Object -First 1
          if (-not $legacyProbe -or -not $modernProbe) { throw 'Paint.NET reference assemblies not found.' }
          "PDN_51_DIR=$($legacyProbe.Directory.FullName)" >> $env:GITHUB_ENV
          "PDN_52_DIR=$($modernProbe.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Build both adapters
        working-directory: ${{ env.PLUGIN_DIR }}
        shell: pwsh
        run: |
          dotnet build .\PaintDotNetAi.csproj -c Release -p:PaintDotNetDir="$env:PDN_51_DIR" --nologo
          dotnet build .\PaintDotNetAi.Modern.csproj -c Release -p:PaintDotNetDir="$env:PDN_52_DIR" --nologo

      - name: Download and verify Real-ESRGAN model
        working-directory: ${{ env.PLUGIN_DIR }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\model | Out-Null
          $model = Join-Path $PWD 'model/realesr-general-x4v3.onnx'
          Invoke-WebRequest $env:MODEL_URL -OutFile $model
          if ((Get-FileHash $model -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:MODEL_SHA256) {
            throw 'Real-ESRGAN model checksum mismatch.'
          }

      - name: Run model smoke test
        working-directory: ${{ env.PLUGIN_DIR }}
        shell: pwsh
        run: dotnet run --project .\tests\ModelSmoke\ModelSmoke.csproj -c Release -f net9.0-windows -- .\model\realesr-general-x4v3.onnx

      - name: Package release asset and smoke-test shared runtime
        working-directory: ${{ env.PLUGIN_DIR }}
        shell: pwsh
        run: |
          $legacyBuild = Join-Path $PWD 'bin/Release/net9.0-windows'
          $modernBuild = Join-Path $PWD 'bin/Release/net10.0-windows'
          $dist = Join-Path $PWD 'dist'
          $package = Join-Path $dist 'package'
          $common = Join-Path $package 'Common/Travny.PaintDotNet.AI'
          $legacyPackage = Join-Path $package 'Paint.NET-5.1'
          $modernPackage = Join-Path $package 'Paint.NET-5.2+'
          New-Item -ItemType Directory -Force -Path $common, $legacyPackage, $modernPackage | Out-Null

          Copy-Item "$legacyBuild/Travny.PaintDotNet.AI.dll" $legacyPackage
          Copy-Item "$modernBuild/Travny.PaintDotNet.AI.Modern.dll" $modernPackage
          Get-ChildItem $legacyBuild -Filter 'Microsoft.ML.OnnxRuntime*.dll' | Copy-Item -Destination $common

          $native = Get-ChildItem $legacyBuild -Recurse -Filter onnxruntime.dll |
            Where-Object { $_.FullName -match 'win-x64' } |
            Select-Object -First 1
          if (-not $native) { throw 'Windows x64 ONNX Runtime native library not found.' }
          Copy-Item $native.FullName "$common/onnxruntime.dll"

          $providerShared = Get-ChildItem $native.Directory.FullName -Filter onnxruntime_providers_shared.dll -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($providerShared) { Copy-Item $providerShared.FullName $common }

          New-Item -ItemType Directory -Force -Path "$common/model" | Out-Null
          Copy-Item .\model\realesr-general-x4v3.onnx "$common/model/"
          Copy-Item .\licenses "$common/licenses" -Recurse
          Copy-Item .\Install.bat "$package/Install.bat"

          foreach ($required in @(
            "$legacyPackage/Travny.PaintDotNet.AI.dll",
            "$modernPackage/Travny.PaintDotNet.AI.Modern.dll",
            "$common/Microsoft.ML.OnnxRuntime.dll",
            "$common/onnxruntime.dll",
            "$common/model/realesr-general-x4v3.onnx"
          )) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "Package file missing: $required" }
          }

          foreach ($tfm in @('net9.0-windows', 'net10.0-windows')) {
            $smoke = Join-Path $dist "runtime-smoke-$tfm"
            dotnet publish .\tests\ModelSmoke\ModelSmoke.csproj -c Release -f $tfm --no-self-contained -o $smoke --nologo
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed for $tfm with exit code $LASTEXITCODE" }

            Get-ChildItem $smoke -Recurse -File |
              Where-Object { $_.Name -like 'Microsoft.ML.OnnxRuntime*.dll' -or $_.Name -like 'onnxruntime*.dll' } |
              Remove-Item -Force
            Remove-Item (Join-Path $smoke 'runtimes') -Recurse -Force -ErrorAction SilentlyContinue

            Get-ChildItem $common -File -Filter '*.dll' | Copy-Item -Destination $smoke
            New-Item -ItemType Directory -Force -Path (Join-Path $smoke 'model') | Out-Null
            Copy-Item "$common/model/realesr-general-x4v3.onnx" (Join-Path $smoke 'model/realesr-general-x4v3.onnx')

            dotnet (Join-Path $smoke 'ModelSmoke.dll') (Join-Path $smoke 'model/realesr-general-x4v3.onnx')
            if ($LASTEXITCODE -ne 0) { throw "Runtime smoke test failed for $tfm with exit code $LASTEXITCODE" }
          }

          @'
          Paint.NET AI Restore

          Run Install.bat and select your Paint.NET version. It combines the matching
          adapter with the shared ONNX Runtime, model and license files, then installs
          per-user to Documents\Paint.NET App Files\Effects\Travny.PaintDotNet.AI.

          Portable users: create Effects\Travny.PaintDotNet.AI, copy everything from
          Common\Travny.PaintDotNet.AI into it, then add the matching adapter DLL from
          Paint.NET-5.1 or Paint.NET-5.2+. Restart Paint.NET after installation.
          '@ | Set-Content "$package/INSTALL.txt"

          Compress-Archive -Path "$package/*" -DestinationPath "$dist/paintdotnet-ai.zip" -CompressionLevel Optimal
          (Get-FileHash "$dist/paintdotnet-ai.zip" -Algorithm SHA256).Hash.ToLowerInvariant() + '  paintdotnet-ai.zip' |
            Set-Content "$dist/SHA256SUMS"

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paintdotnet-ai-release
          path: |
            paintdotnet/ai/dist/paintdotnet-ai.zip
            paintdotnet/ai/dist/SHA256SUMS
          retention-days: 7
